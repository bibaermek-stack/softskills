<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>STEM VR тренажер</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .a-enter-vr { bottom: 20px !important; right: 20px !important; }
    .hud { position: absolute; top: 12px; left: 12px; z-index: 10; max-width: 340px; padding: 11px 15px;
      color: #fff; background: rgba(10, 16, 28, .82); backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, .28); border-radius: 12px; font-size: 13px;
      pointer-events: none; user-select: none; box-shadow: 0 8px 28px rgba(0, 0, 0, .45); }
    .hud b { display: block; margin-bottom: 3px; color: #7dd3fc; font-size: 13.5px; }
    .hud span { color: #cbd5e1; font-size: 12px; line-height: 1.4; }
    #loading { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
      color: #cbd5e1; font-size: 14px; background: #05070b; transition: opacity .6s; }
    #loading.done { opacity: 0; pointer-events: none; }
  </style>
  <!-- A-Frame бірінші жүктеледі: vr-scenes.js оның компоненттерін тіркейді. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="vr-scenes.js"></script>
</head>
<body>
  <div class="hud"><b>3D виртуалды тренажер</b><span id="hud-text">Нысанды тышқанмен немесе контроллер триггерімен басыңыз.</span></div>
  <div id="loading">3D сахна жүктелуде…</div>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('s') || 'physics';
      document.body.insertAdjacentHTML('beforeend', window.VRScenes.markup(id));
    })();
  </script>
</body>
</html>
